name: 验证
on: [push, pull_request]
jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 编译和逻辑回归
        shell: pwsh
        run: ./verify.ps1 -JdkHome $env:JAVA_HOME
      - name: 安装界面验证依赖
        shell: pwsh
        run: |
          npm ci --prefix tools/verify
          npm ci --prefix webapp
      - name: 二维界面与真实桌面三维回归
        shell: pwsh
        run: ./verify.ps1 -Ui -DesktopUi -JdkHome $env:JAVA_HOME
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-verification
          path: |
            tools/verify/verification-output/pipeline-home/*.png
            tools/verify/verification-output/pipeline-home/*.gif
            tools/verify/direct-preview-output/*.png
            tools/verify/direct-preview-output/result.json
